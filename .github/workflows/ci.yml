name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv lock --check
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: make pylint
      - run: uv run mypy
      - run: make imports
      - run: make deps
      - run: make dead
      - run: make licenses
      - run: npx --yes markdownlint-cli2@0.24.1
      - run: uv run pytest -q --cov --cov-branch --cov-report=term-missing --cov-fail-under=70
