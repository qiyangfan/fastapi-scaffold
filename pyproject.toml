[project]
name = "fastapi-scaffold"
version = "0.1.0"
description = "FastAPI 服务脚手架（业务无关，复制即用）"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.143",
  "pydantic-settings>=2.7",
  # StarletteHTTPException 直接 import，按 deptry 纪律声明为一等依赖
  "starlette>=1.8,<2",
  "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
  "deptry>=0.25.1",
  "httpx2>=2,<3",
  "import-linter>=2.2",
  "mypy>=2.3",
  "pre-commit>=4.0",
  "pylint>=3.3",
  "pytest>=9.1",
  "pytest-cov>=7.0",
  "ruff>=0.16",
  "vulture>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# 结构规则取工具默认阈值（复杂度 10、分支 12、语句 50），与 kongming/siku 同口径
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "S",
  "ASYNC",
  "RUF",
  "C901",
  "PLR0912",
  "PLR0915",
  "PERF",
  "RET",
  "TRY",
  "BLE",
  "DTZ",
  "G",
  "LOG",
  "T20",
  "PTH",
  "ICN",
  "RUF100",
]
# 保留中文注释和文档中的全角标点；TRY003 会把每个抛出点拆成异常类，收益不抵成本
ignore = ["RUF001", "RUF002", "RUF003", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# 脚本的 stdout 是命令行接口，不是调试输出
"scripts/*" = ["T201"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
# 严格模式：未登记 marker、未知 ini 配置项直接报错
addopts = "--strict-markers --strict-config"
# 警告即错误；测试用 TestClient 不触发生命周期外的资源告警
filterwarnings = ["error"]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["app"]
branch = true
relative_files = true

[tool.coverage.report]
fail_under = 70

[tool.deptry]
known_first_party = ["app"]
exclude = ["tests", ".venv", "__pycache__", ".pytest_cache", ".mypy_cache", ".ruff_cache"]

[tool.deptry.per_rule_ignores]
# uvicorn 是进程入口，代码内无 import
DEP002 = ["uvicorn"]

[tool.importlinter]
root_packages = ["app"]

[[tool.importlinter.contracts]]
name = "api 不得依赖启动入口"
type = "forbidden"
source_modules = ["app.api"]
forbidden_modules = ["app.main"]

[[tool.importlinter.contracts]]
name = "settings 是叶子模块"
type = "forbidden"
source_modules = ["app.settings"]
forbidden_modules = ["app.api", "app.main", "app.logging"]
