# 克隆后运行 `uv run pre-commit install --install-hooks` 启用
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: commitcheck
        name: "提交信息（<type>(<scope>): 描述）"
        entry: scripts/commitcheck.sh --file
        language: system
        stages: [commit-msg]
      - id: mypy
        name: mypy strict
        entry: uv run mypy
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: lint-imports
        name: import-linter
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: vulture
        name: vulture
        entry: uv run vulture src --min-confidence 100
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: deptry
        name: deptry
        entry: uv run deptry src
        language: system
        pass_filenames: false
        stages: [pre-commit]
